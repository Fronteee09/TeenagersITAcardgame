<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - TeenagersITAcards</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    min-height: 100vh;
    background: #0d1118;
    color: #e0e6ed;
  }
  .content {
    flex: 1;
    padding: 40px;
  }
  .panel {
    max-width: 800px;
    background: #161b22;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  h1 { margin-top: 0; color: #fff; }
  p { line-height: 1.6; color: #b8c7d9; }

  /* Gestione Mobile: il layout si trasforma in colonna per non rimpicciolire tutto */
  @media (max-width: 768px) {
    body {
      flex-direction: column;
    }
    .content {
      padding: 20px;
    }
  }
</style>
</head>
<body>

<!-- Qui viene caricata la sidebar in automatico -->
<div id="sidebar-container"></div>

<div class="content">
  <div class="panel">
    <h1>Benvenuto su TeenagersITAcards!</h1>
    <p>Il sito ufficiale dei giochi di carte della community. Da qui puoi navigare tra le sezioni senza problemi, sia da PC che da telefono.</p>
  </div>
</div>

<script>
  // Caricamento dinamico del menu e attivazione del link Home
  fetch('sidebar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('sidebar-container').innerHTML = data;
      const links = document.querySelectorAll('.sidebar a');
      links.forEach(link => {
        if (link.getAttribute('href') === 'index.html') {
          link.classList.add('active');
        }
      });
    });
</script>

</body>
</html>
