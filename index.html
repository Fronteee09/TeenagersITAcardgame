<!DOCTYPE html>
<html lang="it" class="theme-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Carte di r/TeenagersITA</title>
<style>
  /* --- Stili Base e Temi Aero Classici --- */
  :root.theme-dark {
    --bg-grad-1: #1a2230; --bg-grad-2: #111620; --bg-grad-3: #0d1118;
    --panel-bg: rgba(22, 27, 34, 0.85);
    --text-main: #e0e6ed; --text-muted: #b8c7d9; 
    --border-color: rgba(255, 255, 255, 0.15);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 51%, rgba(255,255,255,0.05) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.05) 51%, rgba(255,255,255,0.15) 100%);
  }
  :root.theme-light {
    --bg-grad-1: #eaf6ff; --bg-grad-2: #cfe8fa; --bg-grad-3: #dff1fc;
    --panel-bg: rgba(255, 255, 255, 0.85);
    --text-main: #1a1a1a; --text-muted: #4a5568; 
    --border-color: rgba(127, 184, 224, 0.4);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, rgba(230,242,255,0.8) 50%, rgba(200,225,250,0.8) 51%, rgba(235,245,255,0.9) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(240,248,255,0.9) 50%, rgba(210,230,255,0.9) 51%, rgba(245,250,255,1) 100%);
  }
  :root.theme-yellow {
    --bg-grad-1: #fef08a; --bg-grad-2: #fde047; --bg-grad-3: #eab308;
    --panel-bg: rgba(255, 251, 235, 0.9);
    --text-main: #713f12; --text-muted: #854d0e; 
    --border-color: rgba(202, 138, 4, 0.4);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.8) 0%, rgba(254,240,138,0.8) 50%, rgba(253,224,71,0.8) 51%, rgba(254,249,195,0.9) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(254,243,199,0.9) 50%, rgba(253,230,138,0.9) 51%, rgba(255,255,255,1) 100%);
  }
  
  * { box-sizing: border-box; }
  body {
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    font-size: 15px;
    display: flex; 
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
    color: var(--text-main);
  }

  .content { 
    flex: 1; 
    padding: 50px; 
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  
  .panel {
    max-width: 1000px; 
    width: 100%;
    background: var(--panel-bg);
    border: 1px solid var(--border-color); 
    border-radius: 12px; 
    padding: 40px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 12px 32px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
    transition: max-width 0.3s ease;
  }

  body.mobile-view { flex-direction: column; }
  body.mobile-view .panel { max-width: 400px !important; margin: 60px auto 20px auto; }
  
  .panel h1 { font-size: 26px; margin-top: 0; color: var(--text-main); }
  .panel p { font-size: 15px; line-height: 1.7; color: var(--text-muted); }
  .dynamic-link { color: #3b82d6; text-decoration: none; font-weight: bold; }
  .dynamic-link:hover { text-decoration: underline; }
  
  .warning {
    margin-top: 20px; 
    color: var(--text-main); 
    font-weight: bold; 
    font-size: 14px;
    background: rgba(227, 179, 65, 0.15); 
    padding: 12px 16px; 
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }
</style>
</head>
<body>

<!-- Contenitore della Sidebar (che caricherà anche i bottoni globali se usi la sidebar unificata) -->
<div id="sidebar-container"></div>

<div class="content">
  <div class="panel">
    <h1>Carte di r/TeenagersITA:</h1>
    <p>Benvenuti sul sito dei giochi di carte legati a TeenagersITA.</p>
    <p>Questo progetto realizzato interamente da Fronte ★ (<a href="https://www.reddit.com/user/Unknow_guy21/" target="_blank" class="dynamic-link">u/Unknow_guy21</a>) si basa sul creare un gioco interattivo disponibile a tutti.</p>
    <div class="warning">⚠ Le carte presenti su questo sito sono autorizzate dagli utenti ⚠</div>
  </div>
</div>

<script>
  // Caricamento della Sidebar e attivazione del link corrente
  fetch('sidebar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('sidebar-container').innerHTML = data;
      const links = document.querySelectorAll('.sidebar a');
      links.forEach(link => {
        if (link.getAttribute('href') === 'index.html') {
          link.classList.add('active');
        }
      });
    });

  // Applicazione immediata del tema salvato in precedenza (se presente)
  const savedTheme = localStorage.getItem('site_theme');
  if (savedTheme) {
    document.documentElement.className = savedTheme;
  }
</script>

</body>
</html>
