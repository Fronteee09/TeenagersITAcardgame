<!DOCTYPE html>
<html lang="it" class="theme-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Carte di r/TeenagersITA</title>
<style>
  /* Temi Aero (Scuro, Chiaro e Giallo) */
  :root.theme-dark {
    --bg-grad-1: #1a2230; --bg-grad-2: #111620; --bg-grad-3: #0d1118;
    --panel-bg: rgba(22, 27, 34, 0.85);
    --text-main: #e0e6ed; --text-muted: #b8c7d9; 
    --border-color: rgba(255, 255, 255, 0.15);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 51%, rgba(255,255,255,0.05) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.05) 51%, rgba(255,255,255,0.15) 100%);
  }
  :root.theme-light {
    --bg-grad-1: #eaf6ff; --bg-grad-2: #cfe8fa; --bg-grad-3: #dff1fc;
    --panel-bg: rgba(255, 255, 255, 0.85);
    --text-main: #1a1a1a; --text-muted: #4a5568; 
    --border-color: rgba(127, 184, 224, 0.4);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, rgba(230,242,255,0.8) 50%, rgba(200,225,250,0.8) 51%, rgba(235,245,255,0.9) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(240,248,255,0.9) 50%, rgba(210,230,255,0.9) 51%, rgba(245,250,255,1) 100%);
  }
  :root.theme-yellow {
    --bg-grad-1: #fef08a; --bg-grad-2: #fde047; --bg-grad-3: #eab308;
    --panel-bg: rgba(255, 251, 235, 0.9);
    --text-main: #713f12; --text-muted: #854d0e; 
    --border-color: rgba(202, 138, 4, 0.4);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.8) 0%, rgba(254,240,138,0.8) 50%, rgba(253,224,71,0.8) 51%, rgba(254,249,195,0.9) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(254,243,199,0.9) 50%, rgba(253,230,138,0.9) 51%, rgba(255,255,255,1) 100%);
  }
  
  * { box-sizing: border-box; }
  body {
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    font-size: 15px;
    display: flex; 
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
    color: var(--text-main);
  }

  /* Controlli in alto a destra */
  .top-controls { 
    position: fixed; 
    top: 15px; 
    right: 20px; 
    display: flex; 
    gap: 10px; 
    z-index: 1200; 
  }
  .control-btn {
    background: var(--aero-btn-bg);
    border: 1px solid var(--border-color); 
    color: var(--text-main); 
    padding: 8px 14px;
    border-radius: 8px; 
    cursor: pointer; 
    font-size: 14px; 
    font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 4px 10px rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .control-btn:hover {
    background: var(--aero-btn-hover);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 6px 12px rgba(0,0,0,0.4);
  }

  /* Menu a tendina impostazioni (Ingranaggio) */
  .settings-dropdown {
    position: absolute;
    top: 45px;
    right: 0;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    display: none;
    flex-direction: column;
    gap: 6px;
    width: 160px;
  }
  .settings-dropdown.show {
    display: flex;
  }
  .dropdown-item {
    background: transparent;
    border: none;
    color: var(--text-main);
    text-align: left;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .dropdown-item:hover {
    background: var(--aero-btn-hover);
  }

  .content { 
    flex: 1; 
    padding: 50px; 
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  
  .panel {
    max-width: 1000px; 
    width: 100%;
    background: var(--panel-bg);
    border: 1px solid var(--border-color); 
    border-radius: 12px; 
    padding: 40px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 12px 32px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
    transition: max-width 0.3s ease;
  }

  body.mobile-view { flex-direction: column; }
  body.mobile-view .panel { max-width: 400px !important; margin: 60px auto 20px auto; }
  
  .panel h1 { font-size: 26px; margin-top: 0; color: var(--text-main); }
  .panel p { font-size: 15px; line-height: 1.7; color: var(--text-muted); }
  .dynamic-link { color: #3b82d6; text-decoration: none; font-weight: bold; }
  .dynamic-link:hover { text-decoration: underline; }
  
  .warning {
    margin-top: 20px; 
    color: var(--text-main); 
    font-weight: bold; 
    font-size: 14px;
    background: rgba(227, 179, 65, 0.15); 
    padding: 12px 16px; 
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }
</style>
</head>
<body>

<div class="top-controls">
  <button id="viewToggle" class="control-btn">Vista: PC</button>
  
  <div style="position: relative;">
    <button id="settingsBtn" class="control-btn">⚙ Impostazioni</button>
    <div id="settingsMenu" class="settings-dropdown">
      <button class="dropdown-item" onclick="setTheme('theme-dark')">🌙 Aero Scuro</button>
      <button class="dropdown-item" onclick="setTheme('theme-light')">☀️ Aero Chiaro</button>
      <button class="dropdown-item" onclick="setTheme('theme-yellow')">⭐ Aero Giallo</button>
    </div>
  </div>
</div>

<div id="sidebar-container"></div>

<div class="content">
  <div class="panel">
    <h1>Carte di r/TeenagersITA:</h1>
    <p>Benvenuti sul sito dei giochi di carte legati a TeenagersITA.</p>
    <p>Questo progetto realizzato interamente da Fronte ★ (<a href="https://www.reddit.com/user/Unknow_guy21/" target="_blank" class="dynamic-link">u/Unknow_guy21</a>) si basa sul creare un gioco interattivo disponibile a tutti.</p>
    <div class="warning">⚠ Le carte presenti su questo sito sono autorizzate dagli utenti ⚠</div>
  </div>
</div>

<script>
  // 1. Carica la sidebar
  fetch('sidebar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('sidebar-container').innerHTML = data;
      const links = document.querySelectorAll('.sidebar a');
      links.forEach(link => {
        if (link.getAttribute('href') === 'index.html') {
          link.classList.add('active');
        }
      });
    });

  // 2. Gestione menu tendina ingranaggio
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    settingsMenu.classList.toggle('show');
  });

  window.addEventListener('click', () => {
    settingsMenu.classList.remove('show');
  });

  // 3. Funzione cambio tema e salvataggio
  function setTheme(themeName) {
    document.documentElement.className = themeName;
    localStorage.setItem('site_theme', themeName);
    settingsMenu.classList.remove('show');
  }

  const savedTheme = localStorage.getItem('site_theme');
  if (savedTheme) {
    document.documentElement.className = savedTheme;
  }

  // 4. Tasto Vista PC / Mobile
  const viewToggle = document.getElementById('viewToggle');
  viewToggle.addEventListener('click', () => {
    document.body.classList.toggle('mobile-view');
    if (document.body.classList.contains('mobile-view')) {
      viewToggle.textContent = 'Vista: Mobile';
    } else {
      viewToggle.textContent = 'Vista: PC';
    }
  });
</script>

</body>
</html>
