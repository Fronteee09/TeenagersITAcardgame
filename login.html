<!DOCTYPE html>
<html lang="it" class="dark theme-blue">
<head>
<meta charset="UTF-8">
<title>Account - Carte di r/TeenagersITA</title>
<style>
  :root {
    --bg-grad-1: #1a2230; --bg-grad-2: #111620; --bg-grad-3: #0d1118;
    --sidebar-grad-1: rgba(35, 45, 60, 0.9); --sidebar-grad-2: rgba(20, 26, 36, 0.95);
    --panel-grad-1: rgba(30, 38, 50, 0.85); --panel-grad-2: rgba(18, 24, 33, 0.9);
    --text-main: #e0e6ed; --text-muted: #b8c7d9; --border-color: rgba(255, 255, 255, 0.15);
  }
  html.theme-blue { --col-main: #3b82d6; --col-dark: #1c529c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
    color: var(--text-main);
  }
  .sidebar {
    width: 200px; flex-shrink: 0;
    background: linear-gradient(to bottom, var(--sidebar-grad-1) 0%, var(--sidebar-grad-2) 100%);
    border-right: 1px solid var(--border-color); padding: 18px 0;
  }
  .sidebar h2 { font-size: 15px; padding: 0 18px; margin: 0 0 16px; color: var(--text-main); }
  .sidebar a {
    display: block; margin: 4px 10px; padding: 9px 12px; border-radius: 6px;
    color: var(--text-muted); text-decoration: none; font-size: 13px;
  }
  .sidebar a:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-main); }
  .sidebar a.active {
    background: linear-gradient(to bottom, var(--col-main), var(--col-dark));
    color: #fff; font-weight: bold;
  }
  .content { flex: 1; padding: 40px 50px; display: flex; justify-content: center; align-items: center; }
  .panel {
    width: 100%; max-width: 450px;
    background: linear-gradient(to bottom, var(--panel-grad-1) 0%, var(--panel-grad-2) 100%);
    border: 1px solid var(--border-color); border-radius: 10px; padding: 30px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  h1 { font-size: 22px; margin-top: 0; margin-bottom: 20px; color: var(--text-main); text-align: center; }
  .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; color: var(--text-muted); font-weight: bold; }
  input {
    padding: 10px; border-radius: 6px; border: 1px solid var(--border-color);
    background: rgba(0, 0, 0, 0.2); color: var(--text-main); font-size: 14px;
  }
  .btn-container { display: flex; gap: 10px; margin-top: 20px; }
  .auth-btn {
    flex: 1; padding: 10px; border-radius: 6px; border: none; cursor: pointer;
    font-weight: bold; color: white; background: linear-gradient(to bottom, var(--col-main), var(--col-dark));
  }
  .secondary-btn { background: #4a5568; }
  #msg { margin-top: 15px; font-size: 13px; text-align: center; font-weight: bold; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>TeenagersITAcards</h2>
  <a href="index.html">Home</a>
  <a href="annunci.html">Annunci</a>
  <a href="carte.html">Carte</a>
  <a href="giocacolbot.html">Gioca vs Bot</a>
  <a href="login.html" class="active">Account</a>
</div>

<div class="content">
  <div class="panel">
    <h1>Area Utente</h1>
    <div id="authForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="tua@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="********">
      </div>
      <div class="btn-container">
        <button class="auth-btn" id="loginBtn">Accedi</button>
        <button class="auth-btn secondary-btn" id="signupBtn">Registrati</button>
      </div>
    </div>
    
    <div id="userProfile" style="display: none;">
      <p>Sei loggato come: <b id="userEmailDisplay"></b></p>
      <button class="auth-btn secondary-btn" id="logoutBtn" style="width: 100%;">Esci (Logout)</button>
    </div>

    <div id="msg"></div>
  </div>
</div>

<script type="module">
  import { supabase } from './supabase.js';

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const signupBtn = document.getElementById('signupBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const msg = document.getElementById('msg');
  const authForm = document.getElementById('authForm');
  const userProfile = document.getElementById('userProfile');
  const userEmailDisplay = document.getElementById('userEmailDisplay');

  async function checkUser() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      authForm.style.display = 'none';
      userProfile.style.display = 'block';
      userEmailDisplay.textContent = session.user.email;
    }
  }
  checkUser();

  signupBtn.addEventListener('click', async () => {
    msg.style.color = 'orange';
    msg.textContent = "Registrazione in corso...";
    const { error } = await supabase.auth.signUp({
      email: emailInput.value,
      password: passwordInput.value,
    });
    if (error) {
      msg.style.color = '#e74c3c';
      msg.textContent = "Errore: " + error.message;
    } else {
      msg.style.color = '#2ecc71';
      msg.textContent = "Registrazione riuscita! Controlla la mail o prova ad accedere.";
    }
  });

  loginBtn.addEventListener('click', async () => {
    msg.style.color = 'orange';
    msg.textContent = "Accesso in corso...";
    const { error } = await supabase.auth.signInWithPassword({
      email: emailInput.value,
      password: passwordInput.value,
    });
    if (error) {
      msg.style.color = '#e74c3c';
      msg.textContent = "Errore di accesso: " + error.message;
    } else {
      msg.style.color = '#2ecc71';
      msg.textContent = "Login effettuato con successo!";
      setTimeout(() => location.reload(), 1000);
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    location.reload();
  });
</script>

</body>
</html>
