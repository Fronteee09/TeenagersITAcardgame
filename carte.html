<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeb89Fanpage (Non ufficiale)</title>
    <style>
        :root {
            --bg-color: #040914;
            --aero-glass: rgba(10, 25, 50, 0.45);
            --aero-glass-border: rgba(100, 180, 255, 0.25);
            --aero-glass-shine: rgba(255, 255, 255, 0.15);
            --text-color: #e0f0ff;
            --text-muted: #8ab4f8;
            --accent-blue: #0077ff;
            --accent-blue-hover: #3399ff;
            --button-glow: rgba(0, 119, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 100, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 50, 150, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #02050c 0%, #081226 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Layout principale con Sidebar a destra */
        .wrapper {
            display: flex;
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }

        /* Contenuto principale (Sinistra) */
        .main-content {
            flex: 1;
            background: var(--aero-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--aero-glass-border);
            border-top: 1px solid var(--aero-glass-shine);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 150, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 150, 255, 0.4);
            letter-spacing: 1px;
        }

        .fanpage-statement {
            font-size: 1.3rem;
            color: var(--text-muted);
            background: rgba(0, 100, 255, 0.1);
            border: 1px solid rgba(0, 150, 255, 0.2);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.1);
        }

        /* Sidebar a destra */
        .sidebar {
            width: 280px;
            background: var(--aero-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--aero-glass-border);
            border-top: 1px solid var(--aero-glass-shine);
            border-radius: 16px;
            padding: 25px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar h3 {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        /* Tasti stile Aero Blu nella Sidebar */
        .aero-btn {
            background: linear-gradient(to bottom, #1a8cff 0%, #0055cc 100%);
            color: #ffffff;
            border: 1px solid #4da6ff;
            border-top: 1px solid #80bfff;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 15px var(--button-glow), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .aero-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25), transparent);
            border-radius: 8px 8px 0 0;
            pointer-events: none;
        }

        .aero-btn:hover {
            background: linear-gradient(to bottom, #3399ff, #0066ff);
            border-color: #80bfff;
            box-shadow: 0 6px 20px rgba(0, 130, 255, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .aero-btn:active {
            transform: translateY(1px);
            background: linear-gradient(to bottom, #004499, #003380);
            box-shadow: 0 2px 8px rgba(0, 100, 255, 0.5), inset 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        /* Responsive per dispositivi mobili */
        @media (max-width: 900px) {
            .wrapper {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Contenuto Principale -->
        <main class="main-content">
            <h1>Zeb89Fanpage</h1>
            <div class="fanpage-statement">
                La zeb89Fanpage è un fanpage (Non ufficiale)
            </div>
        </main>

        <!-- Sidebar a Destra con Tasti Blu -->
        <aside class="sidebar">
            <h3>Navigazione</h3>
            <a href="#" class="aero-btn">Home</a>
            <a href="#" class="aero-btn">Video</a>
            <a href="#" class="aero-btn">Citazioni</a>
            <a href="#" class="aero-btn">Community</a>
            <a href="#" class="aero-btn">Contatti</a>
        </aside>
    </div>

</body>
</html>
