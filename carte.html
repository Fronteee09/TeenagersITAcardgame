<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte - Carte di r/TeenagersITA</title>
<style>
  :root {
    --bg-grad-1: #1a2230; --bg-grad-2: #111620; --bg-grad-3: #0d1118;
    --panel-bg: rgba(22, 27, 34, 0.85);
    --text-main: #e0e6ed; --text-muted: #b8c7d9; 
    --border-color: rgba(255, 255, 255, 0.15);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 51%, rgba(255,255,255,0.05) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.05) 51%, rgba(255,255,255,0.15) 100%);
  }
  html.light {
    --bg-grad-1: #eaf6ff; --bg-grad-2: #cfe8fa; --bg-grad-3: #dff1fc;
    --panel-bg: rgba(255, 255, 255, 0.85);
    --text-main: #1a1a1a; --text-muted: #4a5568; 
    --border-color: rgba(127, 184, 224, 0.4);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, rgba(230,242,255,0.8) 50%, rgba(200,225,250,0.8) 51%, rgba(235,245,255,0.9) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(240,248,255,0.9) 50%, rgba(210,230,255,0.9) 51%, rgba(245,250,255,1) 100%);
  }
  
  * { box-sizing: border-box; }
  body {
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    font-size: 15px;
    display: flex; 
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
    color: var(--text-main);
  }

  .top-controls { 
    position: fixed; 
    top: 15px; 
    right: 20px; 
    display: flex; 
    gap: 10px; 
    z-index: 1200; 
  }
  .control-btn {
    background: var(--aero-btn-bg);
    border: 1px solid var(--border-color); 
    color: var(--text-main); 
    padding: 8px 14px;
    border-radius: 8px; 
    cursor: pointer; 
    font-size: 14px; 
    font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 4px 10px rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    transition: all 0.2s ease;
  }
  .control-btn:hover {
    background: var(--aero-btn-hover);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 6px 12px rgba(0,0,0,0.4);
  }

  .content { 
    flex: 1; 
    padding: 50px; 
  }

  .page-title {
    font-size: 26px;
    margin-top: 0;
    margin-bottom: 25px;
    color: var(--text-main);
  }
  
  /* Griglia delle carte */
  .cards-grid {
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
  }

  /* Stile singolo box carta */
  .card-box {
    background: var(--panel-bg);
    border-radius: 12px;
    padding: 20px;
    width: 260px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 12px 32px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Contorni personalizzati per rarità */
  .card-box.legendary {
    border: 2px solid #facc15; /* Oro / Giallo */
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 15px rgba(250, 204, 21, 0.3);
  }
  .card-box.rare {
    border: 2px solid #94a3b8; /* Argento */
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 15px rgba(148, 163, 184, 0.3);
  }

  .card-image {
    width: 100%;
    height: 280px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 15px;
    border: 1px solid var(--border-color);
  }

  .card-name {
    font-size: 18px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 5px;
  }

  .card-rarity {
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .legendary .card-rarity { color: #facc15; background: rgba(250, 204, 21, 0.1); }
  .rare .card-rarity { color: #cbd5e1; background: rgba(148, 163, 184, 0.1); }

  body.mobile-view .cards-grid {
    flex-direction: column;
    align-items: center;
  }
</style>
</head>
<body>

<div class="top-controls">
  <button id="viewToggle" class="control-btn">Vista: PC</button>
  <button id="themeToggle" class="control-btn">Tema: Scuro</button>
</div>

<div id="sidebar-container"></div>

<div class="content">
  <h1 class="page-title">Collezione Carte</h1>
  
  <div class="cards-grid">
    <!-- Carta Aspro (Leggendario) -->
    <div class="card-box legendary">
      <img src="aspro.png" alt="Aspro" class="card-image">
      <div class="card-name">Aspro</div>
      <div class="card-rarity">Leggendario</div>
    </div>

    <!-- Carta Clipp3r (Raro) -->
    <div class="card-box rare">
      <img src="clipp3r.png" alt="Clipp3r" class="card-image">
      <div class="card-name">Clipp3r</div>
      <div class="card-rarity">Raro</div>
    </div>
  </div>
</div>

<script>
  // 1. Caricamento Sidebar e attivazione link 'active' su carte.html
  fetch('sidebar.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('sidebar-container').innerHTML = data;
      const links = document.querySelectorAll('.sidebar a');
      links.forEach(link => {
        if (link.getAttribute('href') === 'carte.html') {
          link.classList.add('active');
        }
      });
    });

  // 2. Cambio Tema Scuro / Chiaro
  const htmlElement = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  
  if (localStorage.getItem('site_theme') === 'light') {
    htmlElement.classList.replace('dark', 'light');
    themeToggle.textContent = 'Tema: Chiaro';
  }

  themeToggle.addEventListener('click', () => {
    if (htmlElement.classList.contains('dark')) {
      htmlElement.classList.replace('dark', 'light');
      themeToggle.textContent = 'Tema: Chiaro';
      localStorage.setItem('site_theme', 'light');
    } else {
      htmlElement.classList.replace('light', 'dark');
      themeToggle.textContent = 'Tema: Scuro';
      localStorage.setItem('site_theme', 'dark');
    }
  });

  // 3. Tasto Vista PC / Mobile
  const viewToggle = document.getElementById('viewToggle');
  viewToggle.addEventListener('click', () => {
    document.body.classList.toggle('mobile-view');
    if (document.body.classList.contains('mobile-view')) {
      viewToggle.textContent = 'Vista: Mobile';
    } else {
      viewToggle.textContent = 'Vista: PC';
    }
  });
</script>

</body>
</html>
