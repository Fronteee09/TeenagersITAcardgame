<!DOCTYPE html>
<html lang="it" class="dark theme-blue">
<head>
<meta charset="UTF-8">
<title>Gioca vs Bot - Carte di r/TeenagersITA</title>
<style>
  :root {
    --bg-grad-1: #1a2230; --bg-grad-2: #111620; --bg-grad-3: #0d1118;
    --sidebar-grad-1: rgba(35, 45, 60, 0.9); --sidebar-grad-2: rgba(20, 26, 36, 0.95);
    --panel-grad-1: rgba(30, 38, 50, 0.85); --panel-grad-2: rgba(18, 24, 33, 0.9);
    --text-main: #e0e6ed; --text-muted: #b8c7d9; --border-color: rgba(255, 255, 255, 0.15);
  }

  html.light {
    --bg-grad-1: #eaf6ff; --bg-grad-2: #cfe8fa; --bg-grad-3: #dff1fc;
    --sidebar-grad-1: rgba(245, 251, 271, 0.9); --sidebar-grad-2: rgba(217, 237, 251, 0.95);
    --panel-grad-1: rgba(255, 255, 255, 0.9); --panel-grad-2: rgba(234, 246, 255, 0.9);
    --text-main: #1a1a1a; --text-muted: #2a2a2a; --border-color: rgba(127, 184, 224, 0.4);
  }

  html.theme-blue { --col-main: #3b82d6; --col-dark: #1c529c; --col-glow: rgba(59, 130, 214, 0.6); }
  html.theme-green { --col-main: #2ecc71; --col-dark: #27ae60; --col-glow: rgba(46, 204, 113, 0.6); }
  html.theme-red { --col-main: #e74c3c; --col-dark: #c0392b; --col-glow: rgba(231, 76, 60, 0.6); }
  html.theme-yellow { --col-main: #f1c40f; --col-dark: #d35400; --col-glow: rgba(241, 196, 15, 0.6); }
  html.theme-gray { --col-main: #7f8c8d; --col-dark: #34495e; --col-glow: rgba(127, 140, 141, 0.6); }
  html.theme-purple { --col-main: #9b59b6; --col-dark: #8e44ad; --col-glow: rgba(155, 89, 182, 0.6); }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
    color: var(--text-main);
  }

  .top-controls {
    position: fixed;
    top: 15px;
    right: 20px;
    display: flex;
    gap: 10px;
    z-index: 1000;
  }
  .control-btn {
    background: linear-gradient(to bottom, var(--col-main), var(--col-dark));
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: transform 0.1s, filter 0.2s;
  }
  .control-btn:hover { filter: brightness(1.1); transform: scale(1.05); }

  .color-dropdown {
    position: absolute;
    top: 45px;
    right: 0;
    background: var(--panel-grad-1);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px;
    display: none;
    flex-direction: column;
    gap: 6px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
  }
  .color-dropdown.show { display: flex; }
  .color-option {
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    color: white;
    text-align: center;
  }
  .opt-blue { background: #3b82d6; }
  .opt-green { background: #2ecc71; }
  .opt-red { background: #e74c3c; }
  .opt-yellow { background: #f39c12; }
  .opt-gray { background: #7f8c8d; }
  .opt-purple { background: #9b59b6; }

  .sidebar {
    width: 200px;
    flex-shrink: 0;
    background: linear-gradient(to bottom, var(--sidebar-grad-1) 0%, var(--sidebar-grad-2) 100%);
    border-right: 1px solid var(--border-color);
    box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.05), 2px 0 10px rgba(0,0,0,0.3);
    padding: 18px 0;
  }
  .sidebar h2 {
    font-size: 15px;
    padding: 0 18px;
    margin: 0 0 16px;
    color: var(--text-main);
  }
  .sidebar a {
    display: block;
    margin: 4px 10px;
    padding: 9px 12px;
    border-radius: 6px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    transition: background-color 0.2s, color 0.2s;
    cursor: pointer;
  }
  .sidebar a:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
  }
  .sidebar a.active {
    background: linear-gradient(to bottom, var(--col-main), var(--col-dark));
    color: #ffffff;
    font-weight: bold;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 0 8px var(--col-glow);
  }

  .content {
    flex: 1;
    padding: 40px 50px;
  }
  .panel {
    max-width: 900px;
    background: linear-gradient(to bottom, var(--panel-grad-1) 0%, var(--panel-grad-2) 100%);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 24px rgba(0, 0, 0, 0.4);
    padding: 24px 28px;
    backdrop-filter: blur(10px);
  }
  .panel h1 { font-size: 20px; margin-top: 0; color: var(--text-main); }
  .panel p { font-size: 14px; line-height: 1.7; color: var(--text-muted); }

  .game-area {
    margin-top: 20px;
    padding: 20px;
    background: rgba(0, 0, 0, 0.2);
    border-radius: 8px;
    border: 1px solid var(--border-color);
    text-align: center;
  }
  .game-btn {
    background: linear-gradient(to bottom, var(--col-main), var(--col-dark));
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: filter 0.2s, transform 0.1s;
  }
  .game-btn:hover { filter: brightness(1.1); transform: scale(1.03); }
</style>
</head>
<body>

<div class="top-controls">
  <button id="themeToggle" class="control-btn" title="Cambia Tema Scuro/Chiaro">&#x1F441;</button>
  <div style="position: relative;">
    <button id="paintToggle" class="control-btn" title="Cambia Colori Sito">&#x1F58C;</button>
    <div id="colorDropdown" class="color-dropdown">
      <div class="color-option opt-blue" data-color="theme-blue">Blu</div>
      <div class="color-option opt-green" data-color="theme-green">Verde</div>
      <div class="color-option opt-red" data-color="theme-red">Rosso</div>
      <div class="color-option opt-yellow" data-color="theme-yellow">Giallo</div>
      <div class="color-option opt-gray" data-color="theme-gray">Grigio</div>
      <div class="color-option opt-purple" data-color="theme-purple">Viola</div>
    </div>
  </div>
</div>

<div class="sidebar">
  <h2>TeenagersITAcards</h2>
  <a href="index.html">Home</a>
  <a href="annunci.html">Annunci</a>
  <a href="carte.html">Carte</a>
  <a href="gioca.html" class="active">Gioca vs Bot</a>
</div>

<div class="content">
  <div class="panel">
    <h1>Arena di Gioco: Gioca contro il Bot</h1>
    <p>Mettiti alla prova scontrandoti contro il bot ufficiale del subreddit!</p>
    
    <div class="game-area">
      <p id="gameStatus">Clicca sul pulsante qui sotto per iniziare una nuova partita e pescare le tue prime carte.</p>
      <button class="game-btn" onclick="iniziaPartita()">Inizia Partita</button>
    </div>
  </div>
</div>

<script>
  // Gestione Temi e Colori sincronizzati con localStorage
  const htmlElement = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const paintToggle = document.getElementById('paintToggle');
  const colorDropdown = document.getElementById('colorDropdown');

  const savedTheme = localStorage.getItem('site_theme');
  const savedColor = localStorage.getItem('site_color');

  if (savedTheme) {
    htmlElement.className = savedTheme;
    themeToggle.innerHTML = (savedTheme === 'light') ? '&#x25D3;' : '&#x1F441;';
  }
  if (savedColor) {
    htmlElement.classList.add(savedColor);
  } else {
    htmlElement.classList.add('theme-blue');
  }

  themeToggle.addEventListener('click', () => {
    let currentTheme = htmlElement.classList.contains('light') ? 'light' : 'dark';
    let newTheme = (currentTheme === 'light') ? 'dark' : 'light';
    
    htmlElement.classList.replace(currentTheme, newTheme);
    themeToggle.innerHTML = (newTheme === 'light') ? '&#x25D3;' : '&#x1F441;';
    localStorage.setItem('site_theme', newTheme);
  });

  paintToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    colorDropdown.classList.toggle('show');
  });

  document.querySelectorAll('.color-option').forEach(option => {
    option.addEventListener('click', () => {
      const selectedColor = option.getAttribute('data-color');
      htmlElement.className = htmlElement.className.replace(/theme-\w+/g, '').trim();
      htmlElement.classList.add(selectedColor);
      localStorage.setItem('site_color', selectedColor);
      colorDropdown.classList.remove('show');
    });
  });

  window.addEventListener('click', () => {
    colorDropdown.classList.remove('show');
  });

  // Logica di esempio per il gioco vs Bot
  function iniziaPartita() {
    const status = document.getElementById('gameStatus');
    status.innerHTML = "🎲 Partita iniziata! Il bot ha pescato le sue carte. A breve implementeremo la plancia di scontro!";
  }
</script>

</body>
</html>
