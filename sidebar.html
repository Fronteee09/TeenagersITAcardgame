<style>
  /* Pulsante per aprire/chiudere la sidebar su mobile */
  .menu-toggle {
    display: none;
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1100;
    background: #21262d;
    color: #e0e6ed;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
  }

  .sidebar {
    width: 220px;
    background: #111620;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    padding: 20px 0;
    flex-shrink: 0;
    transition: transform 0.3s ease;
  }
  .sidebar h2 {
    font-size: 16px;
    padding: 0 20px;
    margin: 0 0 20px;
    color: #e0e6ed;
  }
  .sidebar a {
    display: block;
    margin: 4px 12px;
    padding: 10px 14px;
    border-radius: 6px;
    color: #b8c7d9;
    text-decoration: none;
    font-size: 14px;
  }
  .sidebar a:hover {
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
  }
  .sidebar a.active {
    background: #3b82d6;
    color: #fff;
    font-weight: bold;
  }

  /* Gestione Mobile: la sidebar si nasconde di default e compare col toggle */
  @media (max-width: 768px) {
    .menu-toggle {
      display: block;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 1050;
      transform: translateX(-100%);
    }
    .sidebar.open {
      transform: translateX(0);
    }
  }
</style>

<!-- Pulsante Hamburger per Mobile -->
<button class="menu-toggle" id="menuToggle">&#9776;</button>

<div class="sidebar" id="sidebarMenu">
  <h2>TeenagersITAcards</h2>
  <a href="index.html">Home</a>
  <a href="annunci.html">Annunci</a>
  <a href="carte.html">Carte</a>
  <a href="giocacolbot.html">Gioca vs Bot</a>
  <a href="login.html">Account</a>
</div>

<script>
  // Script di apertura/chiusura sidebar per smartphone
  const toggleBtn = document.getElementById('menuToggle');
  const sidebar = document.getElementById('sidebarMenu');

  if (toggleBtn && sidebar) {
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });
  }
</script>
