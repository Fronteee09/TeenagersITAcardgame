<style>
  .sidebar {
    width: 240px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border-color);
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    backdrop-filter: blur(10px);
    box-shadow: inset -1px 0 0 rgba(255,255,255,0.05);
    z-index: 1000;
    min-height: 100vh;
  }
  .sidebar h2 {
    font-size: 16px;
    color: var(--text-main);
    margin: 0 0 15px 10px;
    font-weight: 700;
  }
  .sidebar a {
    color: var(--text-muted);
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 8px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .sidebar a:hover {
    background: var(--aero-btn-hover);
    color: var(--text-main);
  }
  .sidebar a.active {
    background: var(--aero-btn-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
  }

  /* Sezione Controlli in basso nella sidebar */
  .sidebar-controls {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 20px;
    border-top: 1px solid var(--border-color);
  }
  .control-btn {
    background: var(--aero-btn-bg);
    border: 1px solid var(--border-color); 
    color: var(--text-main); 
    padding: 10px 12px;
    border-radius: 8px; 
    cursor: pointer; 
    font-size: 14px; 
    font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 4px 10px rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
  }
  .control-btn:hover {
    background: var(--aero-btn-hover);
  }

  /* Menu a tendina impostazioni a comparsa */
  .settings-dropdown {
    position: absolute;
    left: 250px;
    bottom: 20px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    display: none;
    flex-direction: column;
    gap: 10px;
    width: 200px;
    z-index: 1200;
  }
  .settings-dropdown.show {
    display: flex;
  }
  .dropdown-section-title {
    font-size: 11px;
    text-transform: uppercase;
    font-weight: bold;
    color: var(--text-muted);
    margin-bottom: 2px;
    letter-spacing: 0.5px;
  }
  .dropdown-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .dropdown-item {
    background: transparent;
    border: none;
    color: var(--text-main);
    text-align: left;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .dropdown-item:hover {
    background: var(--aero-btn-hover);
  }
</style>

<!-- Struttura Sidebar con Controlli Integrati -->
<div class="sidebar">
  <div>
    <h2>TeenagersITAcards</h2>
    <a href="index.html">Home</a>
    <a href="annunci.html">Annunci</a>
    <a href="carte.html">Carte</a>
    <a href="gioca.html">Gioca vs Bot</a>
    <a href="account.html">Account</a>
  </div>

  <!-- Bottoni inseriti ordinatamente in fondo alla sidebar -->
  <div class="sidebar-controls">
    <button id="viewToggle" class="control-btn">Vista: PC</button>
    
    <div style="position: relative;">
      <button id="settingsBtn" class="control-btn">⚙ Impostazioni</button>
      <div id="settingsMenu" class="settings-dropdown">
        
        <div class="dropdown-section-title">Colore Sfondo</div>
        <div class="dropdown-group">
          <button class="dropdown-item" onclick="setColor('color-blue')">🔵 Blu Aero</button>
          <button class="dropdown-item" onclick="setColor('color-yellow')">🟡 Giallo</button>
          <button class="dropdown-item" onclick="setColor('color-red')">🔴 Rosso</button>
          <button class="dropdown-item" onclick="setColor('color-green')">🟢 Verde</button>
          <button class="dropdown-item" onclick="setColor('color-gray')">⚪ Grigio</button>
          <button class="dropdown-item" onclick="setColor('color-purple')">🟣 Viola</button>
        </div>

        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 4px 0;">

        <div class="dropdown-section-title">Modalità</div>
        <div class="dropdown-group">
          <button class="dropdown-item" onclick="setMode('mode-dark')">🌙 Scura</button>
          <button class="dropdown-item" onclick="setMode('mode-light')">☀️ Chiara</button>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');

  if (settingsBtn && settingsMenu) {
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsMenu.classList.toggle('show');
    });

    window.addEventListener('click', () => {
      settingsMenu.classList.remove('show');
    });
  }

  function setColor(colorClass) {
    const htmlEl = document.documentElement;
    htmlEl.classList.remove('color-blue', 'color-yellow', 'color-red', 'color-green', 'color-gray', 'color-purple');
    htmlEl.classList.add(colorClass);
    localStorage.setItem('site_color', colorClass);
    if(settingsMenu) settingsMenu.classList.remove('show');
  }

  function setMode(modeClass) {
    const htmlEl = document.documentElement;
    htmlEl.classList.remove('mode-dark', 'mode-light');
    htmlEl.classList.add(modeClass);
    localStorage.setItem('site_mode', modeClass);
    if(settingsMenu) settingsMenu.classList.remove('show');
  }

  const savedColor = localStorage.getItem('site_color');
  const savedMode = localStorage.getItem('site_mode');
  if (savedColor) {
    document.documentElement.classList.remove('color-blue');
    document.documentElement.classList.add(savedColor);
  }
  if (savedMode) {
    document.documentElement.classList.remove('mode-dark');
    document.documentElement.classList.add(savedMode);
  }

  const viewToggle = document.getElementById('viewToggle');
  if (viewToggle) {
    viewToggle.addEventListener('click', () => {
      document.body.classList.toggle('mobile-view');
      if (document.body.classList.contains('mobile-view')) {
        viewToggle.textContent = 'Vista: Mobile';
      } else {
        viewToggle.textContent = 'Vista: PC';
      }
    });
  }
</script>
