<!DOCTYPE html>
<html lang="it" class="color-blue mode-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte - Carte di r/TeenagersITA</title>
<style>
  /* --- 1. VARIABILI COLORI --- */
  :root.color-blue {
    --h-1: #1a2230; --h-2: #111620; --h-3: #0d1118;
    --l-1: #eaf6ff; --l-2: #cfe8fa; --l-3: #dff1fc;
  }
  :root.mode-dark {
    --bg-grad-1: var(--h-1); --bg-grad-2: var(--h-2); --bg-grad-3: var(--h-3);
    --panel-bg: rgba(22, 27, 34, 0.85);
    --text-main: #e0e6ed; --text-muted: #b8c7d9; 
    --border-color: rgba(255, 255, 255, 0.15);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 51%, rgba(255,255,255,0.05) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.05) 51%, rgba(255,255,255,0.15) 100%);
  }
  :root.mode-light {
    --bg-grad-1: var(--l-1); --bg-grad-2: var(--l-2); --bg-grad-3: var(--l-3);
    --panel-bg: rgba(255, 255, 255, 0.85);
    --text-main: #1a1a1a; --text-muted: #4a5568; 
    --border-color: rgba(127, 184, 224, 0.4);
    --aero-btn-bg: linear-gradient(to bottom, rgba(255,255,255,0.9) 0%, rgba(230,242,255,0.8) 50%, rgba(200,225,250,0.8) 51%, rgba(235,245,255,0.9) 100%);
    --aero-btn-hover: linear-gradient(to bottom, rgba(255,255,255,1) 0%, rgba(240,248,255,0.9) 50%, rgba(210,230,255,0.9) 51%, rgba(245,250,255,1) 100%);
  }

  /* --- 2. STRUTTURA BASE --- */
  * { box-sizing: border-box; }
  body {
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    font-size: 15px;
    display: flex; 
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
    color: var(--text-main);
  }

  /* --- 3. SIDEBAR --- */
  .sidebar {
    width: 240px;
    background: var(--panel-bg);
    border-right: 1px solid var(--border-color);
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    backdrop-filter: blur(10px);
    z-index: 1000;
    min-height: 100vh;
    flex-shrink: 0;
  }
  .sidebar h2 {
    font-size: 16px;
    color: var(--text-main);
    margin: 0 0 15px 10px;
    font-weight: 700;
  }
  .sidebar a {
    color: var(--text-muted);
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 8px;
    font-weight: 500;
    display: block;
    transition: all 0.2s ease;
  }
  .sidebar a:hover {
    background: var(--aero-btn-hover);
    color: var(--text-main);
  }
  .sidebar a.active {
    background: var(--aero-btn-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
  }

  /* --- 4. CONTROLLI IN ALTO A DESTRA --- */
  .top-controls { 
    position: fixed; 
    top: 15px; 
    right: 25px; 
    display: flex; 
    gap: 10px; 
    z-index: 1200; 
  }
  .control-btn {
    background: var(--aero-btn-bg);
    border: 1px solid var(--border-color); 
    color: var(--text-main); 
    padding: 8px 14px;
    border-radius: 8px; 
    cursor: pointer; 
    font-size: 14px; 
    font-weight: 600;
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .control-btn:hover {
    background: var(--aero-btn-hover);
  }
  .settings-dropdown {
    position: absolute;
    top: 45px;
    right: 0;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    display: none;
    flex-direction: column;
    gap: 10px;
    width: 180px;
    z-index: 1300;
    backdrop-filter: blur(10px);
  }
  .settings-dropdown.show {
    display: flex;
  }
  .dropdown-item {
    background: transparent;
    border: none;
    color: var(--text-main);
    text-align: left;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .dropdown-item:hover {
    background: var(--aero-btn-hover);
  }

  /* --- 5. CONTENUTO PRINCIPALE --- */
  .content { 
    flex: 1; 
    padding: 80px 40px 40px 40px; 
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .panel {
    max-width: 1000px; 
    width: 100%;
    background: var(--panel-bg);
    border: 1px solid var(--border-color); 
    border-radius: 12px; 
    padding: 40px;
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }
  body.mobile-view { flex-direction: column; }
  body.mobile-view .panel { max-width: 400px !important; margin: 60px auto 20px auto; }
  
  .panel h1 { font-size: 26px; margin-top: 0; color: var(--text-main); }
</style>
</head>
<body>

<!-- Sidebar con "Carte" attivo -->
<div class="sidebar">
  <h2>TeenagersITAcards</h2>
  <a href="index.html">Home</a>
  <a href="annunci.html">Annunci</a>
  <a href="carte.html" class="active">Carte</a>
  <a href="gioca.html">Gioca vs Bot</a>
  <a href="account.html">Account</a>
</div>

<!-- Controlli in alto a destra -->
<div class="top-controls">
  <button id="viewToggle" class="control-btn">Vista: PC</button>
  <div style="position: relative;">
    <button id="settingsBtn" class="control-btn">⚙ Impostazioni</button>
    <div id="settingsMenu" class="settings-dropdown">
      <button class="dropdown-item" onclick="setTheme('dark')">🌙 Tema Scuro</button>
      <button class="dropdown-item" onclick="setTheme('light')">☀️ Tema Chiaro</button>
    </div>
  </div>
</div>

<!-- Contenuto della sezione Carte -->
<div class="content">
  <div class="panel">
    <h1>Collezione Carte</h1>
    <p>Qui puoi vedere tutte le carte disponibili del gioco.</p>
    <!-- Inserisci qui sotto le tue carte (es. i box delle carte) -->
  </div>
</div>

<!-- Script di gestione -->
<script>
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsMenu = document.getElementById('settingsMenu');
  if (settingsBtn && settingsMenu) {
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsMenu.classList.toggle('show');
    });
    window.addEventListener('click', () => {
      settingsMenu.classList.remove('show');
    });
  }

  function setTheme(theme) {
    if (theme === 'light') {
      document.documentElement.classList.add('mode-light');
      localStorage.setItem('site_theme', 'light');
    } else {
      document.documentElement.classList.remove('mode-light');
      localStorage.setItem('site_theme', 'dark');
    }
    if(settingsMenu) settingsMenu.classList.remove('show');
  }

  if (localStorage.getItem('site_theme') === 'light') {
    document.documentElement.classList.add('mode-light');
  }

  const viewToggle = document.getElementById('viewToggle');
  if (viewToggle) {
    viewToggle.addEventListener('click', () => {
      document.body.classList.toggle('mobile-view');
      viewToggle.textContent = document.body.classList.contains('mobile-view') ? 'Vista: Mobile' : 'Vista: PC';
    });
  }
</script>

</body>
</html>
